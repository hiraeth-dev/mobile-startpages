<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>startpage</title>
  
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0c0406">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">

  <link rel="preload" href="fonts/MapleMono-NF-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/MapleMono-NF-Bold.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css?v=4">
</head>
<body>
  <!-- Interactive Spring Dot Grid Canvas -->
  <canvas id="grid-canvas"></canvas>

  <main class="container">
    <header class="brand">
      <div class="brand-prompt"><span class="sym">λ</span>hiraeth.dev</div>
      <button type="button" class="theme-btn" id="themeBtn" title="Switch Theme">crimson</button>
    </header>

    <nav class="shortcuts" aria-label="Shortcuts">
      <a class="shortcut" href="https://x.com">
        <div class="shortcut-left">
          <span class="shortcut-num">01</span>
          <span class="shortcut-name">twitter</span>
        </div>
        <span class="shortcut-arrow">→</span>
      </a>

      <a class="shortcut" href="https://github.com">
        <div class="shortcut-left">
          <span class="shortcut-num">02</span>
          <span class="shortcut-name">github</span>
        </div>
        <span class="shortcut-arrow">→</span>
      </a>

      <a class="shortcut" href="https://hiraeth-dev.github.io">
        <div class="shortcut-left">
          <span class="shortcut-num">03</span>
          <span class="shortcut-name">hiraeth</span>
        </div>
        <span class="shortcut-arrow">→</span>
      </a>

      <a class="shortcut" href="https://fmhy.net">
        <div class="shortcut-left">
          <span class="shortcut-num">04</span>
          <span class="shortcut-name">fmhy</span>
        </div>
        <span class="shortcut-arrow">→</span>
      </a>
    </nav>

    <form class="search-form" id="searchForm" autocomplete="off">
      <span class="search-prompt">λ</span>
      <input 
        type="text" 
        class="search-input" 
        id="searchInput" 
        placeholder="search..." 
        autocapitalize="none" 
        autocorrect="off" 
        spellcheck="false"
        autofocus
        enterkeyhint="go"
      >
      <button type="button" class="search-clear" id="searchClear" aria-label="Clear">×</button>
    </form>
  </main>

  <script src="grid.js?v=4"></script>
  <script src="app.js?v=4"></script>
</body>
</html>
